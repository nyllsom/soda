<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SODA · 范例</title>
  <style>
    :root{color-scheme:light;font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;color:#222;background:#fff}
    *{box-sizing:border-box}body{margin:0;background:#fff}main{max-width:960px;margin:auto;padding:64px 32px}
    h1{margin:0 0 36px;font-size:28px;font-weight:600}h2{margin:0;font-size:20px;font-weight:600}
    small{margin-left:12px;color:#666;font-size:14px;font-weight:400}p{margin:8px 0 0;color:#666;font-size:14px;line-height:1.7}
    article{display:grid;grid-template-columns:200px 1fr;gap:16px 40px;padding:28px 0;border-top:1px solid #e5e5e5}
    article header{grid-row:span 2}.links{display:flex;flex-wrap:wrap;gap:12px 32px;font-size:15px;line-height:1.7}
    .links span{display:flex;gap:16px}.label{color:#666;font-weight:400}a{color:inherit;text-underline-offset:4px}a:focus-visible{outline:2px solid #222;outline-offset:4px}
    .nju{color:#6f145f}.ipads{color:#2d4198}code{font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
    .usage{display:flex;flex-wrap:wrap;gap:12px 32px;border-top:1px solid #e5e5e5;padding-top:24px;color:#666;font-size:14px}.usage code{margin-left:8px;color:#222}
    @media(max-width:640px){main{padding:40px 24px}article{grid-template-columns:1fr;gap:16px}article header{grid-row:auto}.links{gap:12px 24px}}
  </style>
</head>
<body><main>
  <h1>SODA 范例</h1>
  <article aria-labelledby="quickstart">
    <header><h2 id="quickstart">入门<small>4 页</small></h2><p>内容、布局与动画</p></header>
    <div class="links">
      <span><b class="label">预览</b><a class="nju" href="preview/quickstart-nju.html">NJU</a><a class="ipads" href="preview/quickstart-ipads.html">IPADS</a></span>
      <span><b class="label">源码</b><a href="quickstart/deck.md">.md</a><a href="quickstart/deck.soda">.soda</a></span>
    </div>
    <code>soda example quickstart --copy my-talk</code>
  </article>
  <article aria-labelledby="showcase">
    <header><h2 id="showcase">完整展示<small>14 页</small></h2><p>公式、图表、媒体与场景</p></header>
    <div class="links">
      <span><b class="label">预览</b><a class="nju" href="preview/showcase-nju.html">NJU</a><a class="ipads" href="preview/showcase-ipads.html">IPADS</a></span>
      <span><b class="label">源码</b><a href="showcase/deck.md">.md</a><a href="showcase/deck.soda">.soda</a></span>
    </div>
    <code>soda example showcase --copy my-showcase</code>
  </article>
  <section class="usage" aria-label="使用提示">
    <span>编译<code>soda deck.md</code></span>
    <span>自定义主题<code>soda theme</code></span>
  </section>
</main></body></html>
