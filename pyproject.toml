[project]
name = "soda"
version = "0.1.1"
description = "A Markdown presentation compiler with optional declarative motion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/soda/vendor/zanim_web/LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "build>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soda"]

[tool.hatch.build.targets.wheel.force-include]
"src/soda/vendor/zanim_web/dist/zanim_web_core.wasm" = "soda/vendor/zanim_web/dist/zanim_web_core.wasm"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
